<div class="ngc-code-block-container">
  <div class="ngc-code-block-header">
    <div class="ngc-code-block-lang">
      <span class="lang-dot" [style.background-color]="getLanguageColor()"></span>
      <span class="lang-text">{{ getLanguageLabel() }}</span>
    </div>
    <button class="ngc-code-block-copy-btn" (click)="copyCode()" [class.copied]="copied" title="Copy code">
      <ngc-icon [name]="copied ? 'checkmark-outline' : 'copy-outline'" size="16px"></ngc-icon>
      <span class="copy-text">{{ copied ? 'Copied' : 'Copy' }}</span>
    </button>
  </div>
  <div class="ngc-code-block-body">
    <!-- Case 1: code input is provided -->
    <pre *ngIf="code"><code #codeElem [highlight]="code" [languages]="[language]"></code></pre>
    
    <!-- Case 2: projected content is used -->
    <div class="projected-content" [style.display]="code ? 'none' : 'block'">
      <ng-content></ng-content>
    </div>
  </div>
</div>
