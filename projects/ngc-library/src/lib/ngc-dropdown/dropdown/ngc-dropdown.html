<ngc-menu
  #dropdownMenu
  class="ngc-dropdown"
  maxHeight="400px"
  [hasScrollBar]="!useVirtualScroll"
  (loadMore)="loadMore?.emit(!!$event)"
  (opened)="onOpened($event)"
  (closed)="onClosed($event)"
>
  <ngc-menu-header>
    <ng-template ngcMenuHeader>
      <ngc-menu-header-title>
        <ng-container *ngIf="selectedGroup; else headerTitleBlock">
          <button
            ngcBasicButton
            icon="chevron-left"
            [color]="'LABEL' | color"
            [ngcTooltip]="'WGC.LABEL.BACK' | translate"
            (click)="unselectGroup()"
          ></button>
          {{ selectedGroup?.title || selectedGroup?.label }}
        </ng-container>
        <ng-template #headerTitleBlock>
          {{ placeholder }}
        </ng-template>
      </ngc-menu-header-title>
      <div class="ngc-dropdown-controls">
        <ngc-search-box
          class="ngc-dropdown-controls__search-box"
          autoFocusOn
          searchKey="label"
          [data]="items"
          [placeholder]="searchPlaceholder"
          (filtered)="markForCheck()"
        ></ngc-search-box>
        <button
          class="ngc-dropdown-controls__btn-toogle-all"
          ngcBasicButton
          *ngIf="multiple && filteredItems?.length"
          (click)="dropdownMenu?.isAllItemsActivated ? removeAllItems() : addAllItems()"
        >
          {{ "WGC.LABEL." + ( dropdownMenu?.isAllItemsActivated ? "DESELECT_ALL" : "SELECT_ALL" ) | translate }}
        </button>
      </div>
    </ng-template>
  </ngc-menu-header>

  <ngc-menu-content>
    <ng-template ngcMenuContent>
      <ng-container
        *ngTemplateOutlet="searchBox?.notFoundTemplate"
      ></ng-container>

      <ng-container *ngIf="filteredItems?.length">

        <!-- ===== VIRTUAL SCROLL ===== -->
        <ng-container *ngIf="useVirtualScroll; else normalList">

          <cdk-virtual-scroll-viewport
            [itemSize]="itemSize"
            [minBufferPx]="itemSize * 5"
            [maxBufferPx]="itemSize * 10"
            [style.height.px]="400"
          >
            <!-- NONE ITEM -->
            <button
              ngcMenuItem
              icon="ban"
              *ngIf="visibleNoneOption"
              (click)="clear()"
            >
              {{ "WGC.LABEL.NONE" | translate }}
            </button>

            <!-- ITEM -->
            <ng-container *cdkVirtualFor="let item of filteredItems">
              <button
                ngcMenuItem
                [ngClass]="item?.classes"
                [icon]="item?.icon"
                [iconColor]="item?.color"
                [color]="item?.color"
                [dotColor]="item?.dotColor"
                [disabled]="item?.disabled"
                [autoClose]="!multiple && !item?.children"
                [active]="multiple
                  ? (ngModel | includes: item?.value)
                  : (item?.value !== undefined && ngModel === item?.value)"
                (click)="!item?.disabled && selectItem(item)"
              >
                <div ngcMenuItemPrefix *ngIf="item?.prefixTemp">
                  <ng-container
                    *ngTemplateOutlet="item?.prefixTemp; context: { item: item }"
                  ></ng-container>
                </div>

                <ng-container *ngIf="item?.truncate; else normalItem">
                  <ngc-truncate [limitLine]="item?.truncateLimitLine">
                    <ng-container
                      *ngTemplateOutlet="
                        item?.templateRef;
                        context: { searchQuery: searchBox?.searchQuery }
                      "
                    ></ng-container>
                  </ngc-truncate>
                </ng-container>

                <ng-template #normalItem>
                  <ng-container
                    *ngTemplateOutlet="
                      item?.templateRef;
                      context: { searchQuery: searchBox?.searchQuery }
                    "
                  ></ng-container>
                </ng-template>

                <ngc-icon
                  ngcMenuItemSuffix
                  name="chevron-right"
                  size="20px"
                  *ngIf="item?.children"
                  [color]="'LABEL' | color"
                ></ngc-icon>

                <div ngcMenuItemSuffix *ngIf="item?.suffixTemp">
                  <ng-container
                    *ngTemplateOutlet="item?.suffixTemp; context: { item: item }"
                  ></ng-container>
                </div>
              </button>
            </ng-container>
          </cdk-virtual-scroll-viewport>
        </ng-container>

        <!-- ===== NORMAL LIST ===== -->
        <ng-template #normalList>

          <!-- NONE ITEM -->
          <button
            ngcMenuItem
            icon="ban"
            *ngIf="visibleNoneOption"
            (click)="clear()"
          >
            {{ "WGC.LABEL.NONE" | translate }}
          </button>

          <!-- ITEM -->
          <ng-container *ngFor="let item of filteredItems">
            <button
              ngcMenuItem
              [ngClass]="item?.classes"
              [icon]="item?.icon"
              [iconColor]="item?.color"
              [color]="item?.color"
              [dotColor]="item?.dotColor"
              [disabled]="item?.disabled"
              [autoClose]="!multiple && !item?.children"
              [active]="multiple
                ? (ngModel | includes: item?.value)
                : (item?.value !== undefined && ngModel === item?.value)"
              (click)="!item?.disabled && selectItem(item)"
            >
              <div ngcMenuItemPrefix *ngIf="item?.prefixTemp">
                <ng-container
                  *ngTemplateOutlet="item?.prefixTemp; context: { item: item }"
                ></ng-container>
              </div>

              <ng-container *ngIf="item?.truncate; else normalItem2">
                <ngc-truncate [limitLine]="item?.truncateLimitLine">
                  <ng-container
                    *ngTemplateOutlet="
                      item?.templateRef;
                      context: { searchQuery: searchBox?.searchQuery }
                    "
                  ></ng-container>
                </ngc-truncate>
              </ng-container>

              <ng-template #normalItem2>
                <ng-container
                  *ngTemplateOutlet="
                    item?.templateRef;
                    context: { searchQuery: searchBox?.searchQuery }
                  "
                ></ng-container>
              </ng-template>

              <ngc-icon
                ngcMenuItemSuffix
                name="chevron-right"
                size="20px"
                *ngIf="item?.children"
                [color]="'LABEL' | color"
              ></ngc-icon>

              <div ngcMenuItemSuffix *ngIf="item?.suffixTemp">
                <ng-container
                  *ngTemplateOutlet="item?.suffixTemp; context: { item: item }"
                ></ng-container>
              </div>
            </button>
          </ng-container>

        </ng-template>
      </ng-container>
    </ng-template>
  </ngc-menu-content>
</ngc-menu>

<ngc-form-field
  panelClass="cdk-overlay-highest-pane"
  [backdropClass]="[ 'cdk-overlay-transparent-backdrop', 'cdk-overlay-highest-backdrop' ]"
  [autoFit]="autoFit"
  [label]="label"
  [appearance]="appearance"
  [fakeInput]="isSelected && displayTemp"
  [errorDisplayMode]="errorDisplayMode"
  [offsetY]="formControl ? -20 : 0"
  [required]="required"
  [disabled]="disabled || disableControl"
  [focusing]="dropdownMenu?.isOpened"
  [ngcMenuTriggerFor]="!readonly && !disabled && !disableControl ? dropdownMenu : undefined"
>
  <div ngcFormFieldPrefix *ngIf="!multiple && ( selected?.icon || selected?.dotColor )">
    <ngc-icon size="20px" *ngIf="selected?.icon" [name]="selected?.icon" [color]="selected?.color"></ngc-icon>
    <ngc-color-dot viewOnly *ngIf="selected?.dotColor" [color]="selected?.dotColor"></ngc-color-dot>
  </div>
  <div ngcFormFieldPrefix *ngIf="selected?.prefixTemp">
    <ng-container *ngTemplateOutlet="selected?.prefixTemp; context: { selected: selected }"></ng-container>
  </div>

  <ng-container *ngIf="isSelected && displayTemp; else displayInputBlock">
    <ng-container *ngTemplateOutlet="displayTemp; context: { selected: selected }"></ng-container>
  </ng-container>
  <ng-template #displayInputBlock>
    <input
      ngcFormFieldInput
      readonly
      [style.color]="selected?.color"
      [tabindex]="tabindex"
      [ngModel]="displayValue"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      (keydown.enter)="$event?.stopPropagation(); dropdownMenuTrigger?.open();"
      (blur)="!isDirty && formControl?.markAsUntouched()"
    />
  </ng-template>

  <ng-container *ngIf="formControl; else noFormControlBlock">
    <input
      tabindex="-1"
      style="display: none"
      [formControl]="formControl"
      [disableControl]="disableControl"
      [ngModel]="ngModel"
    />
  </ng-container>
  <ng-template #noFormControlBlock>
    <input
      tabindex="-1"
      style="display: none"
      [disabled]="disabled"
      [ngModel]="ngModel"
    />
  </ng-template>

  <div ngcFormFieldSuffix *ngIf="selected?.suffixTemp">
    <ng-container *ngTemplateOutlet="selected?.suffixTemp; context: { selected: selected }"></ng-container>
  </div>
  <div ngcFormFieldSuffix *ngIf="!readonly">
    <ngc-icon size="16px" [name]="isOpened ? 'chevron-up' : 'chevron-down'"></ngc-icon>
  </div>
  <div ngcFormFieldError *ngIf="formFieldError">
    <ng-content select="[ngcFormFieldError]"></ng-content>
  </div>
</ngc-form-field>
