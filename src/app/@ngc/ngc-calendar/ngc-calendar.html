<div class="ngc-calendar__header">
  <div class="ngc-calendar__header-left">
    <button ngcButton (click)="changeViewDate()">
      {{ "WGC.LABEL.TODAY" | translate }}
    </button>

    <div
      class="ngc-calendar__header-left__view-date"
      ngcDatePicker
      dateOnly
      #datePicker="ngcDatePicker"
      [clearable]="false"
      [pickedDate]="viewDate"
      (picked)="changeViewDate($event?.date)"
    >
      <h4 ngcTruncate [ngSwitch]="view">
        <ng-container *ngSwitchCase="'day'">
          {{ viewDate | momentDate : "dddd, D MMMM, YYYY" }}
        </ng-container>
        <ng-container *ngSwitchCase="'week'">
          {{ startDate | momentDate : "D MMM" }} - {{ endDate | momentDate : "D MMM, YYYY" }}
        </ng-container>
        <ng-container *ngSwitchCase="'month'">
          {{ viewDate | momentDate : "MMMM, YYYY" }}
        </ng-container>
      </h4>
      <ngc-icon
        class="ngc-calendar__header-left__view-date__icon"
        size="16px"
        [name]="datePicker?.isOpened ? 'chevron-up' : 'chevron-down'"
      >
      </ngc-icon>
    </div>
  </div>

  <div class="ngc-calendar__header-middle">
    <ngc-button-toggle [selectedIndex]="selectedIndex">
      <ngc-button-toggle-item (click)="changeView('day')">
        {{ "WGC.LABEL.DAY" | translate }}
      </ngc-button-toggle-item>
      <ngc-button-toggle-item (click)="changeView('week')">
        {{ "WGC.LABEL.WEEK" | translate }}
      </ngc-button-toggle-item>
      <ngc-button-toggle-item (click)="changeView('month')">
        {{ "WGC.LABEL.MONTH" | translate }}
      </ngc-button-toggle-item>
    </ngc-button-toggle>
  </div>

  <div class="ngc-calendar__header-right">
    <button
      ngcButton
      icon="chevron-left"
      [ngcTooltip]="
        'WGC.LABEL.PREVIOUS_PERIOD' | translate : {
          period: ('WGC.LABEL.' + view | uppercase | translate | lowercase)
        }
      "
      (click)="changeViewDate(viewDate, -1)"
    >
    </button>
    <button
      class="ngc-calendar__header-right__next"
      ngcButton
      icon="chevron-right"
      [ngcTooltip]="
        'WGC.LABEL.NEXT_PERIOD' | translate : {
          period: ('WGC.LABEL.' + view | uppercase | translate | lowercase)
        }
      "
      (click)="changeViewDate(viewDate, 1)"
    >
    </button>
  </div>
</div>

<div class="ngc-calendar__body" [ngSwitch]="view">
  <ngc-calendar-day-view
    ngDefaultControl
    #calendarView
    *ngSwitchCase="'day'"
    [creatable]="creatable"
    [displayHighlight]="displayHighlight"
    [maxEventPerHour]="maxEventPerHour"
    [name]="name"
    [placeholder]="placeholder"
    [nameFormControl]="nameFormControl"
    [viewDate]="viewDate"
    [events]="events"
    [eventTemplate]="eventTemplate"
    [actionMenu]="actionMenu"
    [searchBox]="searchBox"
    [(selectedEventID)]="selectedEventID"
    (selectedEventIDChange)="selectedEventIDChange?.emit($event)"
    (periodChange)="changePeriod($event)"
    (eventChange)="eventChange?.emit($event)"
    (eventCreate)="eventCreate?.emit($event)"
  >
  </ngc-calendar-day-view>

  <ngc-calendar-week-view
    ngDefaultControl
    #calendarView
    *ngSwitchCase="'week'"
    [creatable]="creatable"
    [displayHighlight]="displayHighlight"
    [firstWeekDay]="firstWeekDay"
    [name]="name"
    [placeholder]="placeholder"
    [nameFormControl]="nameFormControl"
    [viewDate]="viewDate"
    [events]="events"
    [eventTemplate]="eventTemplate"
    [actionMenu]="actionMenu"
    [searchBox]="searchBox"
    [(selectedEventID)]="selectedEventID"
    (selectedEventIDChange)="selectedEventIDChange?.emit($event)"
    (periodChange)="changePeriod($event)"
    (eventChange)="eventChange?.emit($event)"
    (eventCreate)="eventCreate?.emit($event)"
  >
  </ngc-calendar-week-view>

  <ngc-calendar-month-view
    ngDefaultControl
    #calendarView
    *ngSwitchCase="'month'"
    [creatable]="creatable"
    [displayHighlight]="displayHighlight"
    [firstWeekDay]="firstWeekDay"
    [name]="name"
    [placeholder]="placeholder"
    [nameFormControl]="nameFormControl"
    [viewDate]="viewDate"
    [events]="events"
    [eventTemplate]="eventTemplate"
    [actionMenu]="actionMenu"
    [searchBox]="searchBox"
    [(selectedEventID)]="selectedEventID"
    (selectedEventIDChange)="selectedEventIDChange?.emit($event)"
    (periodChange)="changePeriod($event)"
    (eventChange)="eventChange?.emit($event)"
    (eventCreate)="eventCreate?.emit($event)"
  >
  </ngc-calendar-month-view>
</div>
