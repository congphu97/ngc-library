<ngc-menu-content>
  <ng-template ngcMenuContent>
    <ng-container
      *ngTemplateOutlet="searchBox?.notFoundTemplate"
    ></ng-container>

    <ng-container *ngIf="filteredItems?.length">

      <!-- ===== VIRTUAL SCROLL ===== -->
      <ng-container *ngIf="useVirtualScroll; else normalList">

        <cdk-virtual-scroll-viewport
          [itemSize]="itemSize"
          [minBufferPx]="itemSize * 5"
          [maxBufferPx]="itemSize * 10"
          [style.height.px]="400"
        >
          <!-- NONE ITEM -->
          <button
            ngcMenuItem
            icon="ban"
            *ngIf="visibleNoneOption"
            (click)="clear()"
          >
            {{ "WGC.LABEL.NONE" | translate }}
          </button>

          <!-- ITEM -->
          <ng-container *cdkVirtualFor="let item of filteredItems">
            <button
              ngcMenuItem
              [ngClass]="item?.classes"
              [icon]="item?.icon"
              [iconColor]="item?.color"
              [color]="item?.color"
              [dotColor]="item?.dotColor"
              [disabled]="item?.disabled"
              [autoClose]="!multiple && !item?.children"
              [active]="multiple
                ? (ngModel | includes: item?.value)
                : (item?.value !== undefined && ngModel === item?.value)"
              (click)="!item?.disabled && selectItem(item)"
            >
              <div ngcMenuItemPrefix *ngIf="item?.prefixTemp">
                <ng-container
                  *ngTemplateOutlet="item?.prefixTemp; context: { item: item }"
                ></ng-container>
              </div>

              <ng-container *ngIf="item?.truncate; else normalItem">
                <ngc-truncate [limitLine]="item?.truncateLimitLine">
                  <ng-container
                    *ngTemplateOutlet="
                      item?.templateRef;
                      context: { searchQuery: searchBox?.searchQuery }
                    "
                  ></ng-container>
                </ngc-truncate>
              </ng-container>

              <ng-template #normalItem>
                <ng-container
                  *ngTemplateOutlet="
                    item?.templateRef;
                    context: { searchQuery: searchBox?.searchQuery }
                  "
                ></ng-container>
              </ng-template>

              <ngc-icon
                ngcMenuItemSuffix
                name="chevron-right"
                size="20px"
                *ngIf="item?.children"
                [color]="'LABEL' | color"
              ></ngc-icon>

              <div ngcMenuItemSuffix *ngIf="item?.suffixTemp">
                <ng-container
                  *ngTemplateOutlet="item?.suffixTemp; context: { item: item }"
                ></ng-container>
              </div>
            </button>
          </ng-container>
        </cdk-virtual-scroll-viewport>
      </ng-container>

      <!-- ===== NORMAL LIST ===== -->
      <ng-template #normalList>

        <!-- NONE ITEM -->
        <button
          ngcMenuItem
          icon="ban"
          *ngIf="visibleNoneOption"
          (click)="clear()"
        >
          {{ "WGC.LABEL.NONE" | translate }}
        </button>

        <!-- ITEM -->
        <ng-container *ngFor="let item of filteredItems">
          <button
            ngcMenuItem
            [ngClass]="item?.classes"
            [icon]="item?.icon"
            [iconColor]="item?.color"
            [color]="item?.color"
            [dotColor]="item?.dotColor"
            [disabled]="item?.disabled"
            [autoClose]="!multiple && !item?.children"
            [active]="multiple
              ? (ngModel | includes: item?.value)
              : (item?.value !== undefined && ngModel === item?.value)"
            (click)="!item?.disabled && selectItem(item)"
          >
            <div ngcMenuItemPrefix *ngIf="item?.prefixTemp">
              <ng-container
                *ngTemplateOutlet="item?.prefixTemp; context: { item: item }"
              ></ng-container>
            </div>

            <ng-container *ngIf="item?.truncate; else normalItem2">
              <ngc-truncate [limitLine]="item?.truncateLimitLine">
                <ng-container
                  *ngTemplateOutlet="
                    item?.templateRef;
                    context: { searchQuery: searchBox?.searchQuery }
                  "
                ></ng-container>
              </ngc-truncate>
            </ng-container>

            <ng-template #normalItem2>
              <ng-container
                *ngTemplateOutlet="
                  item?.templateRef;
                  context: { searchQuery: searchBox?.searchQuery }
                "
              ></ng-container>
            </ng-template>

            <ngc-icon
              ngcMenuItemSuffix
              name="chevron-right"
              size="20px"
              *ngIf="item?.children"
              [color]="'LABEL' | color"
            ></ngc-icon>

            <div ngcMenuItemSuffix *ngIf="item?.suffixTemp">
              <ng-container
                *ngTemplateOutlet="item?.suffixTemp; context: { item: item }"
              ></ng-container>
            </div>
          </button>
        </ng-container>

      </ng-template>
    </ng-container>
  </ng-template>
</ngc-menu-content>
