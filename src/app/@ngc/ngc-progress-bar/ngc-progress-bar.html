<div class="ngc-progress-bar" [ngClass]="'ngc-progress-bar--' + getModeName()">
  <!-- Mode INLINE or STATUS -->
  <ng-container *ngIf="isInlineMode || isStatusMode">
    <div class="ngc-progress-bar__label" *ngIf="labelText">
      <div>{{labelText}}</div>
    </div>
    <div class="ngc-progress-bar__line">
      <div class="ngc-progress-bar__line-current"></div>
    </div>
    <div class="ngc-progress-bar__status" *ngIf="statusText && isStatusMode">
      <div>{{statusText}}</div>
      <div>{{percent | number:'1.0-0'}}%</div>
    </div>
  </ng-container>

  <!-- Mode PERCENT_INLINE -->
  <ng-container *ngIf="isPercentInlineMode">
    <div class="ngc-progress-bar__percent-line">
      <div class="ngc-progress-bar__line-current"></div>
      <div class="ngc-progress-bar__line-text">{{ percent | number:'1.0-0' }}%</div>
    </div>
  </ng-container>

  <!-- Mode SAVINGS -->
  <ng-container *ngIf="isSavingsMode">
    <div class="ngc-progress-bar__savings">
      <div class="ngc-progress-bar__savings-header">
        <div class="ngc-progress-bar__savings-category">{{ labelText }}</div>
        <div class="ngc-progress-bar__savings-target">{{ targetText }}</div>
      </div>
      <div class="ngc-progress-bar__savings-bar">
        <div class="ngc-progress-bar__line-current"></div>
      </div>
      <div class="ngc-progress-bar__savings-footer">
        <div class="ngc-progress-bar__savings-achieved">
          {{ statusText || (percent | number:'1.0-0') + '% achieved' }}
        </div>
        <div class="ngc-progress-bar__savings-current">{{ currentValueText }}</div>
      </div>
    </div>
  </ng-container>
</div>
