<div class="ngc-menu-item__prefix">
	<ng-content select="[ngcMenuItemPrefix]"></ng-content>

	<ngc-color-dot ngcMenuItemPrefix viewOnly *ngIf="dotColor" [color]="dotColor">
	</ngc-color-dot>

	<ngc-icon ngcMenuItemPrefix *ngIf="icon" size="20px" [name]="icon" [color]="iconColor">
	</ngc-icon>

	<div ngcMenuItemPrefix *ngIf="menuItemIcon">
		<ng-content select="[ngcMenuItemIcon]"></ng-content>
	</div>
</div>

<div class="ngc-menu-item__content">
	<ng-content></ng-content>
</div>

<div class="ngc-menu-item__suffix">
	<ngc-icon ngcMenuItemSuffix *ngIf="active" name="check" size="20px" color="primary">
	</ngc-icon>

	<ng-content select="[ngcMenuItemSuffix]"></ng-content>
</div>
